# OpenSY CI/CD Pipeline
#
# Runs on every push and pull request to ensure code quality.
# Tests are run on multiple platforms with various configurations.

name: CI

on:
  push:
    branches: [ main, opensy-mainnet, develop ]
  pull_request:
    branches: [ main, opensy-mainnet, develop ]
  workflow_dispatch:  # Allow manual triggers

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_GENERATOR: Ninja
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  # ==========================================================================
  # Linting and Static Analysis
  # ==========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip shellcheck
          pip3 install flake8 codespell
      
      - name: Run lint checks
        run: |
          # Check shell scripts
          find . -name "*.sh" -type f | xargs shellcheck --severity=warning || true
          
          # Check Python scripts
          flake8 --select=E9,F63,F7,F82 --show-source . || true
          
          # Spell check
          codespell --skip=".git,*.o,*.a,build" --quiet-level=2 || true

  # ==========================================================================
  # Static Analysis with clang-tidy
  # ==========================================================================
  clang-tidy:
    name: Clang-Tidy Analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-tidy clang cmake ninja-build \
            libevent-dev libboost-dev libboost-filesystem-dev \
            libboost-test-dev libdb5.3++-dev libsqlite3-dev \
            libminiupnpc-dev libnatpmp-dev libzmq3-dev \
            libsodium-dev libssl-dev pkg-config

      - name: Configure with clang
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTING=OFF \
            -DENABLE_IPC=OFF \
            -DBUILD_GUI=OFF

      - name: Run clang-tidy on OpenSY-specific files
        run: |
          # Focus on OpenSY-specific code to avoid upstream Bitcoin Core warnings
          OPENSY_FILES=$(find src/tokens src/crypto -name "*.cpp" -o -name "*.h" | grep -v test | head -50)
          for file in $OPENSY_FILES; do
            if [ -f "$file" ]; then
              echo "Analyzing: $file"
              clang-tidy "$file" \
                -p build \
                --checks='-*,bugprone-*,performance-*,readability-inconsistent-declaration-parameter-name,modernize-use-override' \
                --warnings-as-errors=bugprone-use-after-move,bugprone-double-free \
                2>&1 || true
            fi
          done

      - name: Upload compile_commands.json
        uses: actions/upload-artifact@v4
        with:
          name: compile-commands
          path: build/compile_commands.json

  # ==========================================================================
  # Static Analysis with cppcheck
  # ==========================================================================
  cppcheck:
    name: Cppcheck Analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run cppcheck on OpenSY-specific files
        run: |
          # Focus on OpenSY-specific code
          cppcheck \
            --enable=warning,performance,portability \
            --error-exitcode=0 \
            --inline-suppr \
            --quiet \
            --std=c++20 \
            --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            -I src \
            src/tokens/ \
            src/crypto/randomx*.cpp \
            src/crypto/randomx*.h \
            src/crypto/argon2*.cpp \
            src/crypto/argon2*.h \
            src/script/src20.cpp \
            src/script/src20.h \
            src/rpc/tokens.cpp \
            2>&1 | tee cppcheck-report.txt

      - name: Upload cppcheck report
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: cppcheck-report.txt

  # ==========================================================================
  # Build on Ubuntu
  # ==========================================================================
  build-ubuntu:
    name: Ubuntu ${{ matrix.os }} - ${{ matrix.config }}
    runs-on: ubuntu-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [22.04, 24.04]
        config: [Release, Debug]
        include:
          - os: 24.04
            config: Release
            coverage: true

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build ccache \
            libevent-dev libboost-dev libboost-filesystem-dev \
            libboost-test-dev libdb5.3++-dev libsqlite3-dev \
            libminiupnpc-dev libnatpmp-dev libzmq3-dev \
            libsodium-dev libssl-dev pkg-config \
            qtbase5-dev qttools5-dev qttools5-dev-tools \
            capnproto libcapnp-dev

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-ubuntu-${{ matrix.os }}-${{ matrix.config }}-${{ github.sha }}
          restore-keys: |
            ccache-ubuntu-${{ matrix.os }}-${{ matrix.config }}-

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_TESTING=ON \
            -DWITH_ZMQ=ON \
            -DWITH_MINIUPNPC=ON \
            -DWITH_NATPMP=ON \
            -DENABLE_IPC=OFF

      - name: Build
        run: cmake --build build -j $(nproc)

      - name: Run unit tests
        run: |
          cd build
          ctest --output-on-failure -j $(nproc) --timeout 300

      - name: Run functional tests (subset)
        if: matrix.config == 'Release'
        run: |
          # Run a subset of functional tests for speed
          # Includes OpenSY-specific tests for RandomX, tokens, and fork features
          python3 test/functional/test_runner.py \
            --jobs 4 \
            --timeout-factor 4 \
            feature_block \
            p2p_segwit \
            wallet_basic \
            rpc_blockchain \
            mining_basic \
            feature_randomx_pow \
            feature_randomx_key_rotation \
            feature_randomx_deep_reorg \
            feature_randomx_key_chaos \
            feature_src20_tokens \
            feature_token_reorg \
            feature_token_stress_reorg \
            feature_token_mempool_limit \
            feature_token_concurrent \
            feature_argon2_fallback \
            feature_coinbase_maturity_fork \
            feature_fork_boundary_reorg \
            wallet_tokens \
            rpc_src20 \
            p2p_randomx_headers

  # ==========================================================================
  # Build on macOS
  # ==========================================================================
  build-macos:
    name: macOS ${{ matrix.os }}
    runs-on: macos-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [14, 15]  # Sonoma, Sequoia

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install cmake ninja ccache boost libevent berkeley-db@5 \
            sqlite miniupnpc libnatpmp zeromq libsodium openssl@3 qt@5

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-macos-${{ matrix.os }}-${{ github.sha }}
          restore-keys: |
            ccache-macos-${{ matrix.os }}-

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_TESTING=ON \
            -DWITH_ZMQ=ON \
            -DENABLE_IPC=OFF \
            -DQt5_DIR=$(brew --prefix qt@5)/lib/cmake/Qt5

      - name: Build
        run: cmake --build build -j $(sysctl -n hw.ncpu)

      - name: Run unit tests
        run: |
          cd build
          ctest --output-on-failure -j $(sysctl -n hw.ncpu) --timeout 300

  # ==========================================================================
  # Build on Windows
  # ==========================================================================
  build-windows:
    name: Windows (MSVC)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: Configure
        run: |
          cmake -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="C:\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DBUILD_TESTING=ON `
            -DENABLE_IPC=OFF `
            -DBUILD_GUI=OFF

      - name: Build
        run: cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS

      - name: Run unit tests
        run: |
          cd build
          ctest -C Release --output-on-failure --timeout 300

  # ==========================================================================
  # Security Scanning
  # ==========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: cpp

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            libevent-dev libboost-dev libsqlite3-dev \
            libsodium-dev libssl-dev pkg-config \
            libdb5.3++-dev libzmq3-dev libminiupnpc-dev libnatpmp-dev

      - name: Build for CodeQL
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_IPC=OFF -DBUILD_GUI=OFF
          cmake --build build -j $(nproc)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ==========================================================================
  # Documentation Build
  # ==========================================================================
  docs:
    name: Build Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Doxygen
        run: sudo apt-get install -y doxygen graphviz

      - name: Build documentation
        run: |
          if [ -f doc/Doxyfile.in ]; then
            cd doc
            doxygen Doxyfile.in || true
          fi

  # ==========================================================================
  # Release Build (only on tags)
  # ==========================================================================
  release:
    name: Create Release
    runs-on: ubuntu-24.04
    needs: [build-ubuntu, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          body: |
            ## OpenSY ${{ github.ref_name }}
            
            ### Verification
            All binaries are reproducible. See doc/guix.md for verification instructions.
            
            ### SHA256 Checksums
            See CHECKSUMS.txt attached to this release.
